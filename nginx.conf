# nginx.conf — JunFire Protection 리버스 프록시 설정
# 목적: Next.js 14 standalone 빌드 리버스 프록시 + HTTPS + 정적 파일 캐시
# 배포 경로: /opt/junfire 기준 (실제 배포 경로로 변경 필요)

# HTTP → HTTPS 자동 리다이렉트
server {
    listen 80;
    server_name your-domain.com;  # 실제 도메인으로 변경

    # HTTP 접속 시 HTTPS로 영구 리다이렉트
    return 301 https://$host$request_uri;
}

# HTTPS 메인 서버 블록
server {
    listen 443 ssl;
    server_name your-domain.com;  # 실제 도메인으로 변경

    # Let's Encrypt SSL 인증서 (Certbot 발급)
    # 발급 명령: sudo certbot --nginx -d your-domain.com
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # TLS 버전 및 암호화 제품군 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;

    # PDF 생성 API 타임아웃 60초 (기본 60s)
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;

    # 업로드 크기 제한 (기본 1MB → 10MB 확장, 필요 시 조정)
    client_max_body_size 10M;

    # [mn-001] Next.js 정적 파일 직접 서빙 + 영구 캐시 설정
    # Next.js content hash 파일명을 활용하여 1년 캐시 설정
    # 주의: 배포 경로(/opt/junfire)와 일치해야 함
    location /_next/static/ {
        alias /opt/junfire/.next/standalone/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;  # 정적 파일 액세스 로그 비활성화 (디스크 절약)
    }

    # 공개 폰트 파일 직접 서빙 (NotoSansKR TTF 등)
    location /fonts/ {
        alias /opt/junfire/.next/standalone/public/fonts/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 공개 정적 파일 (favicon, images 등)
    location /public/ {
        alias /opt/junfire/.next/standalone/public/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 일반 요청 → Next.js 서버 (localhost:3000) 프록시
    location / {
        proxy_pass http://localhost:9955;
        proxy_http_version 1.1;

        # WebSocket 지원 (Next.js HMR 등)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # 실제 클라이언트 IP 전달
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 캐시 우회 (동적 콘텐츠)
        proxy_cache_bypass $http_upgrade;

        # 버퍼 설정 (PDF 다운로드 응답 처리)
        proxy_buffering off;
    }
}
