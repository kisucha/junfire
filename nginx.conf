# nginx.conf — JunFire Protection 리버스 프록시 설정
# 목적: Next.js standalone 빌드 리버스 프록시
# 배포: sudo cp nginx.conf /etc/nginx/sites-available/junfire
#        sudo ln -s /etc/nginx/sites-available/junfire /etc/nginx/sites-enabled/junfire
#        sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name junfire.dogsound.net;

    location / {
        proxy_pass http://localhost:9955;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }
}
